<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta property="og:image" content="https://i.supaimg.com/965e0c3e-50d9-4ba0-97dc-487d00fde583/e48ab96c-e672-429d-b42f-7a7e960a0945.jpg">
  <title>صاحبة عيون الغزال </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== نفس التصميم الأصلي مع إضافة متغيرات للوضع الداكن ===== */
    :root {
      --cream: #fff8f3;
      --blush: #f9d9e6;
      --blush-2: #f3c6da;
      --rose: #e7a3c1;
      --mauve: #a9628c;
      --plum: #4a2f47;
      --gold: #f4d9a8;
      --glass: rgba(255, 255, 255, 0.35);
      --glass-border: rgba(255, 255, 255, 0.55);
      --text-color: #4a2f47;
      --card-bg: rgba(255, 255, 255, 0.35);
      --input-bg: rgba(255, 255, 255, 0.55);
      --input-border: rgba(255, 255, 255, 0.8);
      --shadow: 0 20px 60px rgba(180, 100, 140, 0.25);
      --notif-bg: rgba(255, 255, 255, 0.55);
      --notif-border: rgba(255, 255, 255, 0.7);
    }
    /* الوضع الداكن */
    body.dark-mode {
      --cream: #2d1f2b;
      --blush: #3d2838;
      --blush-2: #4d3246;
      --rose: #b87a9e;
      --mauve: #c99bb2;
      --plum: #f0dce8;
      --glass: rgba(30, 20, 28, 0.7);
      --glass-border: rgba(80, 60, 75, 0.6);
      --text-color: #f0dce8;
      --card-bg: rgba(30, 20, 28, 0.7);
      --input-bg: rgba(50, 35, 45, 0.7);
      --input-border: rgba(100, 70, 90, 0.8);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      --notif-bg: rgba(30, 20, 28, 0.85);
      --notif-border: rgba(80, 60, 75, 0.7);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Tajawal', sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #ffe7f0 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, #ffe0ea 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, #f6c9dd 0%, transparent 55%),
        linear-gradient(160deg, var(--cream) 0%, var(--blush) 55%, var(--blush-2) 100%);
      background-attachment: fixed;
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }
    body.dark-mode {
      background:
        radial-gradient(circle at 15% 20%, #3d2838 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, #3d2838 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, #2d1f2b 0%, transparent 55%),
        linear-gradient(160deg, #1f141c 0%, #2d1f2b 55%, #3d2838 100%);
    }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ===== الخلفية العائمة ===== */
    #hearts-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }
    .heart {
      position: absolute;
      bottom: -10%;
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(233, 150, 190, 0.5));
      animation: floatUp linear infinite;
    }
    .heart svg {
      display: block;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(var(--s, 1));
        opacity: 0;
      }
      10% {
        opacity: .85;
      }
      50% {
        transform: translateY(-55vh) translateX(var(--drift, 20px)) rotate(15deg) scale(var(--s, 1));
      }
      90% {
        opacity: .7;
      }
      100% {
        transform: translateY(-115vh) translateX(calc(var(--drift, 20px) * -1)) rotate(-10deg) scale(var(--s, 1));
        opacity: 0;
      }
    }

    /* ===== إشعار الخطأ ===== */
    #notif-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    #notif {
      pointer-events: auto;
      width: min(92%, 430px);
      background: var(--notif-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--notif-border);
      border-radius: 26px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 35px rgba(167, 76, 116, 0.28);
      transform: translateY(-140%);
      transition: transform .55s cubic-bezier(.34, 1.56, .64, 1);
    }
    #notif.show {
      transform: translateY(0);
    }
    #notif .icon-badge {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(145deg, #ffb4c6, #e97fa6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, .5), 0 4px 10px rgba(217, 90, 140, .35);
    }
    #notif .txt {
      flex: 1;
      min-width: 0;
    }
    #notif .txt .t1 {
      font-weight: 800;
      font-size: 15px;
      color: #7a3357;
    }
    #notif .txt .t2 {
      font-size: 12.5px;
      color: #a05f7e;
      margin-top: 2px;
    }

    /* ===== البطاقة الرئيسية ===== */
    .stage {
      position: relative;
      z-index: 5;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
    }
    .card {
      width: 100%;
      max-width: 390px;
      background: var(--card-bg);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 34px;
      padding: 38px 30px 32px;
      box-shadow: var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      position: relative;
      animation: cardIn .8s cubic-bezier(.2, .9, .25, 1) both;
      transition: background 0.3s, border 0.3s, box-shadow 0.3s;
    }
    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .heart-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(150deg, #ffd7e6, #f6a9c9);
      box-shadow: 0 8px 20px rgba(223, 110, 160, .35), inset 0 1px 2px rgba(255, 255, 255, .7);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 8px 20px rgba(223, 110, 160, .35), inset 0 1px 2px rgba(255, 255, 255, .7);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 10px 26px rgba(223, 110, 160, .5), inset 0 1px 2px rgba(255, 255, 255, .7);
      }
    }
    .heart-badge svg {
      width: 30px;
      height: 30px;
    }

    h1 {
      font-family: 'Aref Ruqaa', serif;
      text-align: center;
      font-size: clamp(24px, 6vw, 30px);
      margin: 0 0 4px;
      color: #6b3457;
      font-weight: 700;
      transition: color 0.3s;
    }
    body.dark-mode h1 {
      color: #f0dce8;
    }
    .sub {
      text-align: center;
      font-size: 13.5px;
      color: #a9718f;
      margin: 0 0 26px;
      font-weight: 400;
      transition: color 0.3s;
    }
    body.dark-mode .sub {
      color: #c9a9be;
    }

    .field {
      position: relative;
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 12.5px;
      color: #8a5273;
      font-weight: 700;
      margin-bottom: 7px;
      padding-right: 4px;
      transition: color 0.3s;
    }
    body.dark-mode .field label {
      color: #c9a9be;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 18px;
      transition: border-color .25s ease, box-shadow .25s ease, background .25s ease;
      overflow: hidden;
    }
    .input-wrap:focus-within {
      border-color: var(--rose);
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 0 4px rgba(233, 150, 190, 0.22);
    }
    body.dark-mode .input-wrap:focus-within {
      background: rgba(60, 40, 55, 0.8);
      box-shadow: 0 0 0 4px rgba(233, 150, 190, 0.3);
    }
    .input-wrap.err {
      border-color: #e9788f;
      animation: shake .45s ease;
    }
    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      20% {
        transform: translateX(-7px);
      }
      40% {
        transform: translateX(6px);
      }
      60% {
        transform: translateX(-4px);
      }
      80% {
        transform: translateX(3px);
      }
    }
    .input-wrap .ic {
      flex: 0 0 auto;
      width: 44px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c17ba0;
    }
    body.dark-mode .input-wrap .ic {
      color: #d9b0c8;
    }
    .input-wrap input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      color: #5b3350;
      padding: 12px 4px 12px 4px;
      font-weight: 500;
      transition: color 0.3s;
    }
    body.dark-mode .input-wrap input {
      color: #f0dce8;
    }
    .input-wrap input::placeholder {
      color: #c79ab4;
      font-weight: 400;
    }
    body.dark-mode .input-wrap input::placeholder {
      color: #a07f93;
    }
    .toggle-eye {
      flex: 0 0 auto;
      width: 44px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #c17ba0;
      background: none;
      border: none;
    }
    .toggle-eye:active {
      transform: scale(.9);
    }
    body.dark-mode .toggle-eye {
      color: #d9b0c8;
    }

    .login-btn {
      width: 100%;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      padding: 15px 0;
      border-radius: 20px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: .3px;
      color: #fff;
      background: linear-gradient(135deg, #e28ab0, #c9689a 60%, #b6588c);
      box-shadow: 0 14px 28px rgba(199, 100, 150, 0.4), inset 0 1px 1px rgba(255, 255, 255, .4);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      transition: transform .15s ease, box-shadow .2s ease;
    }
    .login-btn:active {
      transform: scale(.97);
    }
    .login-btn[disabled] {
      opacity: .85;
      cursor: default;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.45);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .foot {
      text-align: center;
      margin-top: 22px;
      font-size: 11.5px;
      color: #b483a0;
      transition: color 0.3s;
    }
    body.dark-mode .foot {
      color: #b997ae;
    }
    .foot span {
      color: #e98fb6;
    }

    @media (max-width:360px) {
      .card {
        padding: 30px 20px 26px;
        border-radius: 28px;
      }
    }
  </style>
</head>
<body>

  <div id="hearts-field"></div>

  <!-- ===== إشعار الخطأ ===== -->
  <div id="notif-wrap">
    <div id="notif">
      <div class="icon-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2c-4 3-8 6-8 11a8 8 0 0016 0c0-5-4-8-8-11z" fill="#fff"/>
          <path d="M9 12l2 2 4-4" stroke="#e97fa6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="txt">
        <div class="t1">كلمة المرور غلط 💔</div>
        <div class="t2">جرّبي تاني يا قمر</div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="heart-badge">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 21s-7.5-4.9-10-9.3C.4 8 2.4 4.5 6 4.5c2 0 3.6 1.2 6 3.6 2.4-2.4 4-3.6 6-3.6 3.6 0 5.6 3.5 4 7.2C19.5 16.1 12 21 12 21z" fill="#ffffff"/>
        </svg>
      </div>

      <h1>صاحبة عيون الغزال</h1>
      <p class="sub">اشتقنالك.. سجّلي دخولك يا حبيبتي 🤍</p>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <div class="input-wrap" id="userWrap">
            <span class="ic">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
                <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="text" id="username" placeholder="اكتبي اسم المستخدم">
          </div>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap" id="passWrap">
            <span class="ic">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                <rect x="5" y="10.5" width="14" height="9.5" rx="3" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 10.5V8a4 4 0 018 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
              </svg>
            </span>
            <input type="password" id="password" placeholder="اكتبي كلمة المرور">
            <button type="button" class="toggle-eye" id="eyeBtn" aria-label="إظهار كلمة المرور">
              <svg id="eyeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">تسجيل الدخول</span>
        </button>
      </form>

      <div class="foot">صُنع بـ <span>♥</span> لسلمى</div>
    </div>
  </div>

  <script>
    /* ===== تطبيق الوضع الداكن من localStorage ===== */
    (function applyTheme() {
      const dark = localStorage.getItem('salma-theme') === 'dark';
      if (dark) document.body.classList.add('dark-mode');
    })();

    /* ===== الخلفية العائمة (قلوب) ===== */
    const heartsField = document.getElementById('hearts-field');
    const colors = ['#f4a6c6', '#f0b8d6', '#e88bb0', '#f7c9de', '#eb9fc2'];

    function spawnHeart() {
      const el = document.createElement('div');
      el.className = 'heart';
      const size = 12 + Math.random() * 22;
      const left = Math.random() * 100;
      const dur = 9 + Math.random() * 8;
      const delay = Math.random() * 2;
      const drift = (Math.random() * 60 - 30) + 'px';
      const color = colors[Math.floor(Math.random() * colors.length)];
      el.style.left = left + 'vw';
      el.style.setProperty('--s', (0.6 + Math.random() * 0.8).toFixed(2));
      el.style.setProperty('--drift', drift);
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = delay + 's';
      el.innerHTML =
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.9-10-9.3C.4 8 2.4 4.5 6 4.5c2 0 3.6 1.2 6 3.6 2.4-2.4 4-3.6 6-3.6 3.6 0 5.6 3.5 4 7.2C19.5 16.1 12 21 12 21z" fill="${color}"/></svg>`;
      heartsField.appendChild(el);
      setTimeout(() => el.remove(), (dur + delay) * 1000 + 200);
    }
    for (let i = 0; i < 14; i++) setTimeout(spawnHeart, i * 350);
    setInterval(spawnHeart, 800);

    /* ===== المؤثرات الصوتية ===== */
    let audioCtx;

    function getCtx() {
      if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function typeTick() {
      const ctx = getCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 720 + Math.random() * 180;
      g.gain.setValueAtTime(0.05, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
      o.connect(g).connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.09);
    }

    function errorSound() {
      const ctx = getCtx();
      [330, 260].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.12);
        g.gain.linearRampToValueAtTime(0.08, ctx.currentTime + i * 0.12 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.12 + 0.28);
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + i * 0.12);
        o.stop(ctx.currentTime + i * 0.12 + 0.3);
      });
    }

    function successMelody() {
      const ctx = getCtx();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        const t = ctx.currentTime + i * 0.16;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.09, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g).connect(ctx.destination);
        o.start(t);
        o.stop(t + 0.55);
      });
    }

    /* ===== ربط الصوت بالكتابة ===== */
    ['username', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('input', typeTick);
    });

    /* ===== المتغيرات والعناصر ===== */
    const CORRECT_USER = 'salma';
    const CORRECT_PASS_VARIANTS = ['6/4/2008', '6-4-2008', '06/04/2008', '642008', '6.4.2008'];

    const form = document.getElementById('loginForm');
    const userWrap = document.getElementById('userWrap');
    const passWrap = document.getElementById('passWrap');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const notif = document.getElementById('notif');

    const eyeBtn = document.getElementById('eyeBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const passInput = document.getElementById('password');

    eyeBtn.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      eyeIcon.innerHTML = isPass ?
        `<path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M2 12s3.6-6.5 10-6.5c1.8 0 3.4.5 4.7 1.2M22 12s-1.4 2.6-4 4.3M9.9 9.9a2.6 2.6 0 003.6 3.7" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>` :
        `<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.8"/>`;
    });

    function hideNotif() {
      notif.classList.remove('show');
    }

    function showError() {
      userWrap.classList.remove('err');
      passWrap.classList.remove('err');
      void passWrap.offsetWidth;
      passWrap.classList.add('err');
      notif.classList.add('show');
      errorSound();
      setTimeout(() => passWrap.classList.remove('err'), 500);
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      hideNotif();

      const u = document.getElementById('username').value.trim().toLowerCase();
      const p = document.getElementById('password').value.trim();

      const userOk = u === CORRECT_USER;
      const passOk = CORRECT_PASS_VARIANTS.includes(p);

      if (!userOk || !passOk) {
        showError();
        return;
      }

      loginBtn.disabled = true;
      btnText.textContent = 'جاري الدخول...';
      spinner.style.display = 'inline-block';

      setTimeout(() => {
        successMelody();
      }, 300);

      setTimeout(() => {
        window.location.href = 'page.html';
      }, 2500);
    });

    document.addEventListener('click', function(e) {
      if (notif.classList.contains('show')) {
        hideNotif();
      }
    });
  </script>
</body>
</html>
